$('#v').innerHTML=`<h1 class="pf">Histoires</h1><p style="color:var(--tx2);margin-bottom:14px">Sections éditoriales de la page d'accueil : l'histoire d'un parfum, de la maison, d'un ingrédient…</p><button class="btn" style="margin-bottom:14px" onclick="sform()">${ic('plus')} Nouvelle histoire</button>${S2.map(s=>`<div class="pr2"><img src="${E(MB.img(s.image||''))}" alt=""><div><h3>${E(s.title)}</h3><small style="color:var(--tx2)">${E(s.kicker||'')}${s.product_id?' · '+E(pn[s.product_id]||''):''}</small><div class="act" style="margin-top:8px"><button class="st ${s.published?'on':''}" onclick="tps(${s.id},${!s.published})">${s.published?'Publiée':'Brouillon'}</button><button class="st" onclick="sform(${s.id})">${ic('edit')} Modifier</button><button class="st" onclick="dsy(${s.id})">${ic('trash')} Supprimer</button></div></div></div>`).join('')||'<p style="color:var(--tx2)">Aucune histoire.</p>'}`},
async set(){const R=await q(sb.from('settings').select('*')),s={...MB.S.store,...(R.find(r=>r.key==='store')||{}).value},l={...MB.S.loyalty,...(R.find(r=>r.key==='loyalty')||{}).value};
$('#v').innerHTML=`<h1 class="pf">Réglages</h1><div class="c2"><h2 class="pf" style="font-size:20px">Boutique & contact</h2>${F('s1','Bandeau d\'annonce (laisser vide pour le masquer)',s.announcement)}${F('s2','Téléphone',s.phone,'tel')}${F('s3','WhatsApp (numéro avec indicatif, ex 213550123456)',s.whatsapp)}${F('s4','Instagram (lien ou @pseudo)',s.instagram)}${F('s5','Facebook (lien)',s.facebook)}${F('s6','Email',s.email,'email')}${F('s8','Frais de livraison (DA)',s.ship_fee,'number')}<div class="r2"><div>${F('s7','Livraison offerte dès (DA) · 0 = jamais',s.free_ship_from,'number')}</div><div>${F('s9','…ou dès X articles · 0 = jamais',s.free_ship_min_items||0,'number')}</div></div></div><div class="c2"><h2 class="pf" style="font-size:20px">Page d\'accueil</h2><label class="cap l">Photos d'accueil (6 max). Elles remplacent la vidéo si présentes.</label><div id="hi"></div><input type="file" accept="image/*" multiple onchange="uph(this)">${F('h1','Titre principal',s.hero_title)}${F('h2','Texte d\'accroche',s.hero_lead)}${F('h3','Vidéo d\'accueil (lien MP4/WebM, vide = vidéo par défaut)',s.hero_video)}<label class="cap l">Ou envoyer une vidéo (max 50 Mo)</label><input type="file" accept="video/mp4,video/webm" onchange="upv(this)"></div><div class="c2"><h2 class="pf" style="font-size:20px">Programme de fidélité</h2><label class="chk"><input type="checkbox" id="l0" ${l.enabled?'checked':''}> Activer les points</label><div class="r2"><div>${F('l1','Points gagnés par 100 DA',l.earn_per_100da,'number')}</div><div>${F('l2','Points requis pour la remise',l.redeem_cost,'number')}</div></div>${F('l3','Remise obtenue (%)',l.redeem_percent,'number')}<p style="color:var(--tx2);font-size:12px">Le client échange ${l.redeem_cost} points contre −${l.redeem_percent}% sur une commande.</p></div><button class="btn" onclick="ss()">Enregistrer</button>`;window.HI=[...(s.hero_images||[])];rHI()}};
const ol=()=>{const t=oq.toLowerCase();$('#ol').innerHTML=OA.filter(o=>(flt==='toutes'||o.status===flt)&&(!t||(o.ref+' '+((o.customer||{}).name||'')+' '+((o.customer||{}).phone||'')).toLowerCase().includes(t))).map(oc).join('')||'<p style="color:var(--tx2);padding:30px 0;text-align:center">Aucune commande.</p>'};
const oc=o=>{const c=o.customer||{},i=ST.indexOf(o.status),ph=(c.phone||'').replace(/[^0-9+]/g,'').replace(/^0/,'213');return `<div class="c2"><div class="hh"><b class="pf" style="font-size:18px">${E(o.ref)}</b><span class="st ${o.status}">${o.status}</span></div><small style="color:var(--tx2)">${fmt(o.created_at)}</small><p style="margin-top:8px"><b>${E(c.name)}</b> · ${E(c.wilaya)}<br>${E(c.addr)}</p><p style="color:var(--tx2);font-size:12px;margin-top:6px">${(o.items||[]).map(x=>`${x.q}× ${E(x.name)} (${E(x.size)})${x.grav?' « '+E(x.grav)+' »':''}`).join('<br>')}</p><div class="hh" style="margin-top:8px"><b>${MB.da(o.total)}</b><small style="color:var(--tx2)">${o.discount?'Fidélité −'+MB.da(o.discount)+' · ':''}COD</small></div><div class="act"><a class="btn o s" href="tel:${E(c.phone)}" style="text-decoration:none">${ic('phone')} Appeler</a><a class="btn o s" target="_blank" rel="noopener" href="https://wa.me/${ph}" style="text-decoration:none">${ic('wa')} WhatsApp</a>${i>-1&&i<3?`<button class="btn s" onclick="so2(${o.id},'${ST[i+1]}')">→ ${ST[i+1]}</button>`:''}${o.status!=='annulée'&&o.status!=='livrée'?`<button class="btn o s" onclick="confirm('Annuler cette commande ?')&&so2(${o.id},'annulée')">Annuler</button>`:''}</div></div>`};
async function so2(id,s){await q(sb.rpc('set_order_status',{oid:id,st:s}));toast(s==='annulée'?'Commande annulée, points remboursés':'Statut mis à jour');go(tab)}
async function tg(id,a){await q(sb.from('products').update({active:a}).eq('id',id));go('prod')}
async function dp(id){if(confirm('Supprimer ce produit définitivement ?')){await q(sb.from('products').delete().eq('id',id));go('prod')}}
function pform(id){const p=prods.find(x=>x.id===id);ed=p?{...p,sizes:p.sizes.map(s=>({...s})),images:[...p.images],composition:{...(p.composition||{})}}:{name:'',category_id:cats[0]?.id||null,tagline:'',story:'',composition:{},sizes:[{label:'100 ml',price:0}],images:[],badge:'',active:true,position:prods.length+1};
shw(`<h2 class="pf">${id?'Modifier':'Nouveau'} produit</h2><label class="cap l">Photos (5 max, la première est la couverture)</label><div id="imgs"></div><input type="file" id="fi" accept="image/*" multiple onchange="upl(this)">${F('p1','Nom',ed.name)}<label class="cap l">Catégorie</label><select id="p2"><option value="">Sans catégorie</option>${cats.map(c=>`<option value="${c.id}" ${c.id===ed.category_id?'selected':''}>${E(c.name)}</option>`).join('')}</select>${F('p3','Badge (ex : Édition limitée)',ed.badge)}${F('p4','Phrase d\'accroche',ed.tagline)}<label class="cap l">Son histoire</label><textarea id="p5" style="min-height:120px">${E(ed.story)}</textarea><label class="cap l">Composition</label>${F('c1','Notes de tête',ed.composition.top)}${F('c2','Notes de cœur',ed.composition.heart)}${F('c3','Notes de fond',ed.composition.base)}<label class="cap l">Formats & prix (DA)</label><div id="szs"></div><button class="st" onclick="ed.sizes.push({label:'',price:0});rSz()" style="margin-bottom:12px">+ Format</button><label class="chk"><input type="checkbox" id="p6" ${ed.active?'checked':''}> Visible sur le site</label><button class="btn" onclick="sp()">Enregistrer</button>`);rImgs();rSz()}
const rImgs=()=>$('#imgs').innerHTML=`<div class="ims">${ed.images.map((u,i)=>`<div class="im2"><img src="${E(MB.img(u))}" alt=""><div><button onclick="cv(${i})">${i?'Couv.':'★'}</button><button onclick="ed.images.splice(${i},1);rImgs()">✕</button></div></div>`).join('')}</div><small style="color:var(--tx2)">${ed.images.length}/5</small>`;
const rSz=()=>$('#szs').innerHTML=ed.sizes.map((s,i)=>`<div class="r2" style="grid-template-columns:1fr 1fr auto"><input value="${E(s.label)}" placeholder="50 ml" oninput="ed.sizes[${i}].label=this.value"><input type="number" value="${s.price}" placeholder="Prix" oninput="ed.sizes[${i}].price=+this.value"><button class="st" style="margin-bottom:10px" onclick="ed.sizes.splice(${i},1);rSz()">✕</button></div>`).join('');
function cv(i){ed.images.unshift(...ed.images.splice(i,1));rImgs()}
const shrink=(f,m=1400)=>new Promise(r=>{const im=new Image();im.onload=()=>{const k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(r,'image/jpeg',.86)};im.src=URL.createObjectURL(f)});
async function upl(inp){const fs=[...inp.files].slice(0,5-ed.images.length);if(!fs.length)toast('5 photos maximum');for(const f of fs){toast('Envoi de la photo…');const b=await shrink(f),path=`p/${Date.now()}-${Math.random().toString(36).slice(2,7)}.jpg`,r=await sb.storage.from('products').upload(path,b,{contentType:'image/jpeg'});if(r.error)return toast(r.error.message);ed.images.push(sb.storage.from('products').getPublicUrl(path).data.publicUrl);rImgs()}inp.value=''}
async function sp(){const sz=ed.sizes.filter(s=>s.label.trim()&&s.price>0);if(!g('p1')||!sz.length)return toast('Nom et au moins un format avec prix');
const d={name:g('p1'),category_id:$('#p2').value||null,badge:g('p3'),tagline:g('p4'),story:$('#p5').value.trim(),composition:{top:g('c1'),heart:g('c2'),base:g('c3')},sizes:sz.map(s=>({label:s.label.trim(),price:s.price})),images:ed.images.slice(0,5),active:$('#p6').checked,position:ed.position};
await q(ed.id?sb.from('products').update(d).eq('id',ed.id):sb.from('products').insert(d));cl();toast('Produit enregistré');go('prod')}
async function ac(){const v=g('nc');if(!v)return;await q(sb.from('categories').insert({name:v,position:cats.length+1}));go('cat')}
async function rc(id,o){const v=prompt('Nouveau nom',o);if(v&&v.trim()){await q(sb.from('categories').update({name:v.trim()}).eq('id',id));go('cat')}}
async function dc(id){if(confirm('Supprimer cette catégorie ? Les produits resteront, sans catégorie.')){await q(sb.from('categories').delete().eq('id',id));go('cat')}}
async function mc(i){const a=cats[i],b=cats[i-1];await q(sb.from('categories').update({position:b.position}).eq('id',a.id));await q(sb.from('categories').update({position:a.position}).eq('id',b.id));go('cat')}
function dform(id){const d=(window.DL||[]).find(x=>x.id===id)||{name:'',percent:10,product_ids:[],category_id:null,active:true},tl=x=>x?new Date(new Date(x)-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16):'';ed=d;
shw(`<h2 class="pf">${id?'Modifier':'Nouvelle'} remise</h2>${F('d1','Nom (ex : Soldes d\'automne)',d.name)}${F('d2','Pourcentage de remise',d.percent,'number','min=1 max=90')}<label class="cap l">S'applique à</label><select id="d3" onchange="$('#dp').style.display=this.value?'none':''"><option value="">Des produits précis</option>${cats.map(c=>`<option value="${c.id}" ${c.id===d.category_id?'selected':''}>Toute la catégorie : ${E(c.name)}</option>`).join('')}</select><div class="box" id="dp" style="${d.category_id?'display:none':''}">${prods.map(p=>`<label class="chk"><input type="checkbox" value="${p.id}" ${(d.product_ids||[]).includes(p.id)?'checked':''}> ${E(p.name)}</label>`).join('')}</div><div class="r2"><div>${F('d4','Début',tl(d.starts_at),'datetime-local')}</div><div>${F('d5','Fin',tl(d.ends_at),'datetime-local')}</div></div><label class="chk"><input type="checkbox" id="d6" ${d.active?'checked':''}> Active</label><button class="btn" onclick="sd()">Enregistrer</button>`)}
async function sd(){const p=n('d2');if(p<1||p>90)return toast('Pourcentage entre 1 et 90');const cid=$('#d3').value||null,ids=cid?[]:[...$d.querySelectorAll('#dp input:checked')].map(i=>+i.value);if(!cid&&!ids.length)return toast('Choisissez au moins un produit ou une catégorie');
const d={name:g('d1'),percent:p,category_id:cid,product_ids:ids,starts_at:$('#d4').value?new Date($('#d4').value).toISOString():null,ends_at:$('#d5').value?new Date($('#d5').value).toISOString():null,active:$('#d6').checked};
await q(ed.id?sb.from('discounts').update(d).eq('id',ed.id):sb.from('discounts').insert(d));cl();toast('Remise enregistrée');go('disc')}
async function td(id,a){await q(sb.from('discounts').update({active:a}).eq('id',id));go('disc')}
async function dd(id){if(confirm('Supprimer cette remise ?')){await q(sb.from('discounts').delete().eq('id',id));go('disc')}}
async function ap(id){const v=parseInt(prompt('Ajouter (+) ou retirer (−) des points. Ex : 50 ou -20'));if(!v)return;await q(sb.rpc('adjust_points',{uid:id,delta:v}));go('cli')}
async function ss(){await q(sb.from('settings').upsert([{key:'store',value:{announcement:g('s1'),phone:g('s2'),whatsapp:g('s3'),instagram:g('s4'),facebook:g('s5'),email:g('s6'),free_ship_from:n('s7'),ship_fee:n('s8'),hero_title:g('h1'),hero_lead:g('h2'),hero_video:g('h3'),free_ship_min_items:n('s9'),hero_images:HI}},{key:'loyalty',value:{enabled:$('#l0').checked,earn_per_100da:n('l1'),redeem_cost:Math.max(1,n('l2')),redeem_percent:Math.min(90,Math.max(1,n('l3')))}}]));toast('Réglages enregistrés')}
async function upv(i){const f=i.files[0];if(!f)return;if(f.size>52428800)return toast('Vidéo trop lourde (50 Mo max)');toast('Envoi de la vidéo…');const path='site/hero-'+Date.now()+'.'+(f.type.includes('webm')?'webm':'mp4'),r=await sb.storage.from('products').upload(path,f,{contentType:f.type});if(r.error)return toast(r.error.message);$('#h3').value=sb.storage.from('products').getPublicUrl(path).data.publicUrl;toast('Vidéo envoyée : pensez à enregistrer')}
async function pic(f,m){toast('Envoi de la photo…');const b=await shrink(f,m),path=`p/${Date.now()}-${Math.random().toString(36).slice(2,7)}.jpg`,r=await sb.storage.from('products').upload(path,b,{contentType:'image/jpeg'});if(r.error){toast(r.error.message);return null}return sb.storage.from('products').getPublicUrl(path).data.publicUrl}
async function uph(i){const fs=[...i.files].slice(0,6-HI.length);if(!fs.length)toast('6 photos maximum');for(const f of fs){const u=await pic(f,2000);if(u){HI.push(u);rHI()}}i.value=''}
const rHI=()=>$('#hi').innerHTML=`<div class="ims">${HI.map((u,k)=>`<div class="im2"><img src="${E(u)}" alt=""><div><button onclick="HI.unshift(...HI.splice(${k},1));rHI()">${k?'1re':'★'}</button><button onclick="HI.splice(${k},1);rHI()">✕</button></div></div>`).join('')}</div><small style="color:var(--tx2)">${HI.length}/6 · la première s'affiche en premier</small>`;
function sform(id){const s=(window.SL||[]).find(x=>x.id===id);ed=s?{...s}:{title:'',kicker:'Un parfum, une histoire',body:'',image:'',product_id:null,published:true,position:(window.SL||[]).length+1};
shw(`<h2 class="pf">${id?'Modifier':'Nouvelle'} histoire</h2><label class="cap l">Photo</label><div class="ims"><div class="im2" id="si"></div></div><input type="file" accept="image/*" onchange="upS(this)">${F('y1','Titre',ed.title)}${F('y2','Sur-titre',ed.kicker)}<label class="cap l">Texte (ligne vide = nouveau paragraphe)</label><textarea id="y3" style="min-height:220px">${E(ed.body)}</textarea><label class="cap l">Parfum lié (bouton « Découvrir »)</label><select id="y4"><option value="">Aucun</option>${(window.SP||[]).map(p=>`<option value="${p.id}" ${p.id===ed.product_id?'selected':''}>${E(p.name)}</option>`).join('')}</select><label class="chk"><input type="checkbox" id="y5" ${ed.published?'checked':''}> Publier sur la page d'accueil</label><button class="btn" onclick="ssy()">Enregistrer</button>`);rSI()}
const rSI=()=>$('#si').innerHTML=ed.image?`<img src="${E(MB.img(ed.image))}" alt=""><div><button onclick="ed.image='';rSI()">✕</button></div>`:'<small style="color:var(--tx2)">Aucune photo</small>';
async function upS(i){const f=i.files[0];if(!f)return;const u=await pic(f,1600);if(u){ed.image=u;rSI()}i.value=''}
async function ssy(){if(!g('y1'))return toast('Titre requis');const d={title:g('y1'),kicker:g('y2'),body:$('#y3').value.trim(),image:ed.image||null,product_id:$('#y4').value||null,published:$('#y5').checked,position:ed.position};await q(ed.id?sb.from('stories').update(d).eq('id',ed.id):sb.from('stories').insert(d));cl();toast('Histoire enregistrée');go('story')}
async function tps(id,a){await q(sb.from('stories').update({published:a}).eq('id',id));go('story')}
async function dsy(id){if(confirm('Supprimer cette histoire ?')){await q(sb.from('stories').delete().eq('id',id));go('story')}}
boot();
</script></body></html>
